# Publishes a release, either:
#   - from the Actions tab: Release › Run workflow (tags the current main commit as v<versionName>), or
#   - when a version tag such as v1.0 is pushed.
# Builds from exactly that commit, signs with the key held in repository secrets,
# and attaches the APK with its SHA-256 and signing-certificate fingerprint.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64  the release keystore (.jks), base64-encoded
#   KEYSTORE_PASS    its password (keystore and key share one password; key alias "matrixkey")
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out the version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$app"
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Raise versionName in app/build.gradle.kts first."; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$app" ]; then
              echo "::error::Tag $tag does not match versionName $app in app/build.gradle.kts"; exit 1
            fi
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::KEYSTORE_PASS secret is not set"; exit 1; fi
          set -o pipefail
          KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|What went wrong|ERROR:|eystore" -A3 build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Prepare the release
        run: |
          apk="MatrixKey-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs=$("$signer" verify --print-certs "$apk")
          # Refuse to publish anything signed with Android's public debug key.
          if echo "$certs" | grep -q "CN=Android Debug"; then echo "::error::APK is debug-signed; check the secrets"; exit 1; fi
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cert=$(echo "$certs" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          notes="docs/release-notes/$TAG.md"
          { if [ -f "$notes" ]; then cat "$notes"; else echo "Matrix Key $VERSION"; fi
            echo
            echo "SHA-256 (APK): \`$sha\`"
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > release-notes.md
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From the Actions tab this also creates the tag on the commit that was built.
          gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Matrix Key $VERSION" --notes-file release-notes.md --latest
