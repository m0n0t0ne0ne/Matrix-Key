name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|ERROR:|Missing class" -A3 build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report compiler warnings
        if: always()
        run: |
          grep -E "^w: " build.log | sed 's#file://[^ ]*/app/src/main/java/##' | head -40 | while IFS= read -r line; do
            echo "::notice::$line"
          done || true

      - name: Rename APK
        run: |
          ls -l app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk MatrixKey.apk
          echo "UPDATE_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixKey-apk
          path: MatrixKey.apk

      # Publishes the latest build as a downloadable release, so the APK can be
      # grabbed straight from the phone's browser.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Matrix Key — ${{ env.UPDATE_NAME }}
          prerelease: true
          make_latest: true
          body: |
            **${{ env.UPDATE_NAME }}** — automatic build of the newest commit on main.
            Download MatrixKey.apk on your phone and open it to install.
          files: MatrixKey.apk
